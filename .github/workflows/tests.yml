name: Backend tests

on:
  push:
    paths: ["backend/**", ".github/workflows/tests.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi pydantic python-dotenv httpx pytest
      - run: pytest -q
        env:
          LOG_DIR: /tmp/logs
