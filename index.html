<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IIT ISM Wellbeing Chatbot</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://seeklogo.com/vector-logo/519550/iit-ism-dhanbad">
</head>
<body>
  <!-- IIT ISM Themed Header -->
  <header>
    <div class="header-content">
      <img src="https://seeklogo.com/vector-logo/519550/iit-ism-dhanbad"" alt="IIT ISM Logo" class="logo"/>
      <div>
        <h1>IIT ISM Student Wellbeing Assistant</h1>
        <h2>Confidential Campus Support • 24x7</h2>
      </div>
    </div>
  </header>
  
  <!-- Navigation (Optional feature links) -->
  <nav>
    <a href="#" onclick="openResource('counseling')">Campus Counseling</a>
    <a href="#" onclick="openResource('events')">Wellness Events</a>
    <a href="#" onclick="openResource('faq')">FAQs</a>
    <a href="#" onclick="openResource('emergency')">Emergency</a>
  </nav>

  <div class="container">
    <!-- Chat Area -->
    <main class="chat-area" id="chat-messages">
      <!-- Chat messages go here -->
      <div class="chat-message bot">
        <span class="avatar">🤖</span>
        <span>Namaste IIT ISMite! I’m here to support your wellbeing. How can I help you today?</span>
      </div>
    </main>

    <!-- Input Area -->
    <form id="chat-form" class="input-area">
      <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off" />
      <button type="submit">Send</button>
      <button type="button" class="emergency-btn" onclick="openResource('emergency')">🚨 Urgent Help</button>
    </form>
    
    <!-- Quick Student Buttons -->
    <div class="quick-actions">
      <button onclick="quickMessage('I feel exam stress')">Exam Stress</button>
      <button onclick="quickMessage('I feel homesick')">Homesickness</button>
      <button onclick="quickMessage('How do I contact campus counselor?')">Contact Counselor</button>
      <button onclick="quickMessage('Show me wellbeing tips')">Wellbeing Tips</button>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    &copy; 2025 IIT ISM Dhanbad | Student Wellbeing Chatbot | <a href="#" onclick="openResource('privacy')">Privacy & Safety</a>
  </footer>

  <!-- Modal for resources (simple example) -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <div class="modal-body" id="modal-body">
        <!-- Dynamic content -->
      </div>
    </div>
  </div>

  <!-- Script -->
  <script src="chatbot.js"></script>
</body>
</html>
